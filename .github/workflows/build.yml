name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Noticon-debug
          path: app/build/outputs/apk/debug/*.apk

  # release 走 R8：入口类一旦被混淆重命名，java_init.list 会被同步改成混淆名，
  # 模块就整个加载不起来，而且不报错。这一步专门挡这个回归。
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verify module entry survives R8
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list | tr -d '[:space:]')
          echo "java_init.list 声明的入口类: $ENTRY"
          if [ -z "$ENTRY" ]; then
            echo "::error::java_init.list 是空的"
            exit 1
          fi
          # dex 里类名以 / 分隔存储，转成类型描述符再找
          DESCRIPTOR="L$(echo "$ENTRY" | tr '.' '/');"
          echo "在 dex 中查找: $DESCRIPTOR"
          if unzip -p "$APK" classes.dex | grep -a -q "$DESCRIPTOR"; then
            echo "入口类 $ENTRY 确实存在于 classes.dex"
          else
            echo "::error::入口类 $ENTRY 在 dex 中找不到，很可能被 R8 重命名了"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Noticon-release-unsigned
          path: app/build/outputs/apk/release/*.apk
